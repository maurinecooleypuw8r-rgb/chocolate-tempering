version: 2.1

jobs:
  DTL-DATE-IN:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compute step-4 hash
          command: |
            mkdir -p /tmp/wip
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=100000;i++) print int(i/10)" "(i%10)}' > /tmp/wip/URI_4673_bramble.admin; true
            printf 'produced:%d\n' "$(wc -c </tmp/wip/URI_4673_bramble.admin)"
      - persist_to_workspace:
          root: /tmp/wip
          paths:
            - 'URI_4673_bramble.admin'
  break-prod:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/wip
      - run:
          name: Unpack prior
          command: |
            echo /tmp/wip/URI_4673_bramble.admin | sed 's|.*/||' 2>/dev/null || true
      - run:
          name: Snapshot repo
          command: git clone --depth 2 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch corpus
          command: tar xf prod-vendor-prod.tar
      - run:
          name: Post-build check
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: sleep 25s
      - run:
          command: cat /proc/cpuinfo | head -5
      - run:
          command: env ./sniff-reporter
